<!-- PART register-form: one card, three faces. Labels copied from nt-drone.ntplc.co.th/register. Rows are absolute (top px). -->
@switch (state()) {
  @case ('done') {
    <!-- ── face: done ── -->
    <div class="done" aria-live="polite">
      <svg viewBox="0 0 52 52" aria-hidden="true"><circle cx="26" cy="26" r="24" /><path d="M15 27l7 7 15-16" /></svg>
      <h4>ลงทะเบียนสำเร็จ</h4>
      <p>ทีม <b>{{ teamName() }}</b> · รอประกาศผลการคัดเลือก 50 ทีม</p>
    </div>
  }

  @case ('members') {
    <!-- ── face: members + skills question ── -->
    <header><span class="pill">2/2</span><h4>ข้อมูลสมาชิกในทีม (1 - 3 คน)</h4></header>

    <label class="f" style="top: 60px">หัวหน้าทีม (สมาชิกคนที่ 1) <em>*</em></label>
    <div class="input half l" style="top: 80px"><i class="skel" [style.width.%]="memberFill() * 80"></i></div>
    <div class="input half r" style="top: 80px"><i class="skel" [style.width.%]="memberFill() * 60"></i></div>
    <div class="input half l" style="top: 116px"><i class="skel" [style.width.%]="memberFill() * 70"></i></div>
    <div class="input half r" style="top: 116px"><i class="skel" [style.width.%]="memberFill() * 50"></i></div>

    <label class="f" style="top: 158px">สมาชิกคนที่ 2 <span class="opt">(ไม่บังคับ)</span></label>
    <div class="input half l" style="top: 178px"><i class="skel" [style.width.%]="memberFill() * 75"></i></div>
    <div class="input half r" style="top: 178px"><i class="skel" [style.width.%]="memberFill() * 55"></i></div>

    <label class="f" style="top: 220px">สมาชิกคนที่ 3 <span class="opt">(ไม่บังคับ)</span></label>
    <div class="input half l faint" style="top: 240px"></div>
    <div class="input half r faint" style="top: 240px"></div>

    <!-- the question: skills / experience (free text) -->
    <label class="f q" style="top: 282px">ทักษะ/ความสามารถพิเศษ หรือประสบการณ์ที่เกี่ยวข้อง</label>
    <div class="input area" style="top: 302px">
      <i class="skel" [style.width.%]="Math.min(1, answerFill() * 2) * 88"></i>
      <i class="skel" [style.width.%]="Math.max(0, answerFill() * 2 - 1) * 64"></i>
    </div>

    <button type="button" class="submit" [class.press]="pressing()" tabindex="-1">ยืนยันการลงทะเบียน</button>
  }

  @case ('team') {
    <!-- ── face: team + advisor ── -->
    <header><span class="pill">1/2</span><h4>ข้อมูลทีมแข่งขัน</h4></header>

    <label class="f" style="top: 60px">ชื่อทีมผู้สมัคร <em>*</em></label>
    <div class="input" style="top: 80px">{{ teamName().slice(0, typed()) }}<span class="caret"></span></div>

    <label class="f" style="top: 124px">สถาบันอุดมศึกษา / มหาวิทยาลัย <em>*</em></label>
    <div class="input" style="top: 144px"><i class="skel" [style.width.%]="teamFill() * 70"></i></div>

    <div class="sub" style="top: 194px">ข้อมูลอาจารย์ที่ปรึกษา (มีอย่างน้อย 1 ท่าน)</div>
    <label class="f" style="top: 222px">ชื่อ-นามสกุล อาจารย์ที่ปรึกษา <em>*</em></label>
    <div class="input" style="top: 242px"><i class="skel" [style.width.%]="teamFill() * 60"></i></div>
    <label class="f" style="top: 286px">อีเมล / เบอร์โทรศัพท์อาจารย์ <em>*</em></label>
    <div class="input half l" style="top: 306px"><i class="skel" [style.width.%]="teamFill() * 80"></i></div>
    <div class="input half r" style="top: 306px"><i class="skel" [style.width.%]="teamFill() * 60"></i></div>

    <button type="button" class="submit ghost" tabindex="-1">ถัดไป</button>
  }
}
